version: "3.9"
services:
  django:
    build: &build-django
      dockerfile: Dockerfile-django
    command: bash -c "scripts/generate_api_clients.sh && poetry run python manage.py migrate && poetry run python manage.py runserver 0.0.0.0:8000"
    volumes: &volumes-django
      - ./tapir_mail:/app/tapir_mail
      - ./tapir_mail_server:/app/tapir_mail_server
      - ./sqlite:/app/sqlite
    ports:
      - "8000:8000"
    environment:
      VIRTUAL_HOST: localhost
      DEBUG: 1

  react:
    build:
      dockerfile: Dockerfile-react
    volumes:
      - ./tapir_mail_ui/public:/app/tapir_mail_ui/public
      - ./tapir_mail_ui/src:/app/tapir_mail_ui/src
    ports:
      - "3000:3000"
    environment:
      VIRTUAL_HOST: localhost
      DEBUG: 1
    depends_on:
      - django
    stdin_open: true

  redis:
    image: redis:alpine

  celery:
    build: *build-django
    command: bash -c "poetry run celery -A tapir_mail_server worker -l info"
    volumes: *volumes-django
    environment:
      DEBUG: 1
    depends_on:
      - redis

  celery-beat:
    build: *build-django
    command: bash -c "poetry run celery -A tapir_mail_server beat -l info --schedule /tmp/celerybeat-schedule"
    volumes: *volumes-django
    environment:
      DEBUG: 1
    depends_on:
      - redis

  flower:
    build: *build-django
    command: bash -c "poetry run celery -A tapir_mail_server flower"
    volumes: *volumes-django
    environment:
      DEBUG: 1
    ports:
      - "5555:5555"
    depends_on:
      - redis
