version: "3.9"
services:
  web:
    build: .
    command: bash -c "./bundle.sh && poetry run python manage.py runserver 0.0.0.0:8000 & (cd tapir_mail_ui && HOST=0.0.0.0 npm start) & wait"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
      - "3000:3000"
    environment:
      VIRTUAL_HOST: localhost
      DEBUG: 1
