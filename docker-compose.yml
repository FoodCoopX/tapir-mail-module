x-tapir-environment: &tapir-environment
  VIRTUAL_HOST: localhost
  DEBUG: 1
  EMAIL_ENV: prod
  EMAIL_HOST: mailpit
  EMAIL_PORT: 1025
  EMAIL_USE_TLS: False
  EMAIL_USE_SSL: False
  EMAIL_HOST_SENDER: tapir@example.com
  EMAIL_HOST_SENDER_NAME: Test Tapir
  EMAIL_HOST_USER: test
  EMAIL_HOST_PASSWORD: test
  EMAIL_BOUNCE_ADDRESS: tapir@example.com

services:
  web:
    build:
      dockerfile: Dockerfile-django
    image: &django-image tapir-mail-module-django
    command: bash -c "poetry run python manage.py migrate && poetry run python manage.py runserver 0.0.0.0:8000"
    volumes: &volumes-django
      - .:/app
    ports:
      - "8000:8000"
    environment: *tapir-environment
    depends_on:
      - redis
      - db

  react:
    build:
      dockerfile: Dockerfile-react
    command: bash -c "cd tapir_mail_ui && npm install && npm start"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      VIRTUAL_HOST: localhost
      DEBUG: 1
      HOST: 0.0.0.0
    stdin_open: true

  redis:
    image: redis:alpine

  celery:
    image: *django-image
    command: bash -c "poetry run celery -A tapir_mail_server worker -l info"
    volumes: *volumes-django
    environment: *tapir-environment
    depends_on:
      - redis

  celery-beat:
    image: *django-image
    command: bash -c "poetry run celery -A tapir_mail_server beat -l info --schedule /tmp/celerybeat-schedule"
    volumes: *volumes-django
    environment: *tapir-environment
    depends_on:
      - redis

  flower:
    image: *django-image
    command: bash -c "poetry run celery -A tapir_mail_server flower"
    volumes: *volumes-django
    environment: *tapir-environment
    ports:
      - "5555:5555"
    depends_on:
      - redis

  db:
    image: postgres:14
    environment:
      - POSTGRES_DB=tapir
      - POSTGRES_PASSWORD=tapir
      - POSTGRES_USER=tapir
    ports:
      - "5432:5432"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
      - MP_SMTP_AUTH_ACCEPT_ANY=true
    ports:
      - "8025:8025"
      - "1025:1025"
