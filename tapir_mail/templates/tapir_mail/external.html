{% load django_bootstrap5 %}
{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Tapir Newsletter-Anmeldung</title>
  <link rel="stylesheet" href="{% static 'core/bootstrap/5.3.8/css/bootstrap.min.css' %}">
</head>
<body>
<div class="card">
  <div class="card-header"><h5>Anmeldung zum Newsletter: {{ category_name }}</h5></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% bootstrap_form form %}
      <button type="submit" class="btn btn-primary">
        Anmeldung
      </button>
    </form>
  </div>
</div>
</body>
</html>
