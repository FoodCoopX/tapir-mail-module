<!DOCTYPE html>
<html lang="en">

{% load static %}
{% load django_bootstrap5 %}

<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{% static 'core/bootstrap-5.3.1-dist/css/bootstrap.min.css' %}">
</head>
<body>
<div class="card m-2">
    <h5 class="card-header d-flex justify-content-between justify-content-between">
        <span>Create a dummy tapir user</span>
    </h5>
    <div class="card-body">
        <form role="form" method="post">
            {% csrf_token %}
            {% bootstrap_form form %}
            {% bootstrap_button button_type="submit" content="Create" %}
        </form>
    </div>
</div>
</body>
</html>
