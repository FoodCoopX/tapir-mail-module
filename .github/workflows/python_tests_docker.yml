name: Python tests docker

on: [push]

jobs:
  python-tests-docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Check access rights 1
        run: docker compose run web ls -la tapir_mail
      - name: Check access rights 2
        run: docker compose run web ls -la tapir_mail/__ui__
      - name: Check access rights 3
        run: docker compose run web cat tapir_mail/__ui__/index.html
      - name: Run tests
        run: docker compose run web poetry run pytest
