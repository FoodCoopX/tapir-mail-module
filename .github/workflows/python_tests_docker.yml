name: Python tests docker

on: [push]

jobs:
  python-tests-docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: my_registry:${{ github.run_number }}
          outputs: type=docker,dest=./temp_image.tar
      - name: Run tests
        run: |
          docker load --input ./myimage.tar
          docker run my_registry:${{ github.run_number }} poetry run pytest
