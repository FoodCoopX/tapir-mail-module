name: Python tests docker

on: [push]

jobs:
  python-tests-docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: docker compose build
      - name: Check
        run: docker compose run web ls -la tapir_mail_ui/
      - name: Run tests
        run: docker compose run web poetry run pytest
