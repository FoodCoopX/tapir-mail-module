name: Release

on:
  push:
    branches:
      - master
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "18"

      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: "adopt"
          java-version: "11"

      - name: Generate API schema
        run: bash /app/scripts/generate_api_schema.sh

      - name: Run bundle script
        run: bash /app/scripts/bundle.sh

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.11"

      - name: Package tapir_mail
        run: |
          cd tapir_mail
          python -m pip install --upgrade setuptools wheel
          python setup.py sdist bdist_wheel

      - name: Set tag
        id: set_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "::set-output name=tag::${GITHUB_REF##refs/tags/}"
          elif [[ "${{ github.ref }}" == refs/heads/master ]]; then
            echo "::set-output name=tag::latest-dev"
          else
            echo "::set-output name=tag::manual"
          fi

      - name: Draft new release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.set_tag.outputs.tag }}
          release_name: Release ${{ steps.set_tag.outputs.tag }}
          draft: true  # This makes the release a draft
            
            
      - name: Extract version
        id: extract_version
        run: |
           VERSION=${{ steps.set_tag.outputs.tag }}
           echo "::set-output name=version::${VERSION##v}"

      - name: Upload tapir_mail package to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./tapir_mail/dist/tapir_mail-${{ steps.extract_version.outputs.version }}-py3-none-any.whl
          asset_name: tapir_mail-${{ steps.extract_version.outputs.version }}-py3-none-any.whl
          asset_content_type: application/zip
