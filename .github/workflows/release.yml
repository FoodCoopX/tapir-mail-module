name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "adopt"
          java-version: "11"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: bash scripts/install.sh

      - name: Generate API schema
        run: bash scripts/generate_api_schema.sh

      - name: Run bundle script
        run: bash scripts/bundle.sh
        env:
          CI: false #  otherwise React warnings will be treated as errors
          REACT_APP_BASENAME: /mail

      - name: Set tag and version
        id: set_tag_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG=${GITHUB_REF##refs/tags/}
            VERSION=${TAG}
          else
            TIMESTAMP=$(date +%s)
            TAG="0.0.0-dev-${TIMESTAMP}"
            VERSION="0.0.0.dev${TIMESTAMP}"
          fi
          echo "::set-output name=tag::${TAG}"
          echo "::set-output name=version::${VERSION}"

      - name: Draft new release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.TAPIR_MAIL_RELEASE_TOKEN }}
        with:
          owner: FoodCoopX
          repo: tapir-mail-releases
          tag_name: ${{ steps.set_tag_version.outputs.tag }}
          release_name: Release ${{ steps.set_tag_version.outputs.tag }}
          draft: true
          commitish: main
          body: |
            Release for ${{ steps.set_tag_version.outputs.tag }}.
            [View commit on GitHub](https://github.com/FoodCoopX/tapir-mail-module/commit/${{ github.sha }})

      - name: Set version in pyproject.toml
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.set_tag_version.outputs.version }}\"/" pyproject.toml

      - name: Build tapir_mail
        id: build
        run: |
          poetry build
          WHEEL_FILE=$(ls dist/*.whl)
          echo "::set-output name=wheel_file::${WHEEL_FILE##*/}"

      - name: Upload tapir_mail package to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.TAPIR_MAIL_RELEASE_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/${{ steps.build.outputs.wheel_file }}
          asset_name: ${{ steps.build.outputs.wheel_file }}
          asset_content_type: application/zip
