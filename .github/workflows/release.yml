name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install apt packages
        run: sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "adopt"
          java-version: "11"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        run: bash scripts/install.sh

      - name: Generate API schema
        run: bash scripts/generate_api_schema.sh

      - name: Run bundle script
        run: bash scripts/bundle.sh
        env:
          CI: false #  otherwise React warnings will be treated as errors
          REACT_APP_BASENAME: /mail

      - name: Set tag and version
        id: set_tag_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG=${GITHUB_REF##refs/tags/}
            VERSION=${TAG}
          else
            TIMESTAMP=$(date +%s)
            TAG="0.0.0-dev-${TIMESTAMP}"
            VERSION="0.0.0.dev${TIMESTAMP}"
          fi
          echo "::set-output name=tag::${TAG}"
          echo "::set-output name=version::${VERSION}"

      - name: Set version in pyproject.toml
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.set_tag_version.outputs.version }}\"/" pyproject.toml

      - name: Build tapir_mail
        id: build
        run: |
          poetry build
          WHEEL_FILE=$(ls dist/*.whl)
          echo "::set-output name=wheel_file::${WHEEL_FILE##*/}"

      - name: Draft new release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.TAPIR_MAIL_RELEASE_TOKEN }}
        with:
          repository: FoodCoopX/tapir-mail-releases
          tag_name: ${{ steps.set_tag_version.outputs.tag }}
          name: Release ${{ steps.set_tag_version.outputs.tag }}
          draft: true
          target_commitish: main
          body: |
            Release for ${{ steps.set_tag_version.outputs.tag }}.
            [View commit on GitHub](https://github.com/FoodCoopX/tapir-mail-module/commit/${{ github.sha }})
          files: ${{ steps.build.outputs.wheel_file }}
          working_directory: dist
