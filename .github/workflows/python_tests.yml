name: Python tests

on: [push]

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "poetry"
      - name: Install dependencies
        run: poetry install
      - name: Bundle
        run: ./bundle.sh
        env:
          CI: false # must set this to false otherwise "npm build" treats warnings as errors
      - name: Run tests
        run: poetry run pytest
