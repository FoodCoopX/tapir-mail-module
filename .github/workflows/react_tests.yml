name: React tests docker

on: [push]

jobs:
  react-tests-docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Generate api clients
        run: docker compose run react bash /app/scripts/generate_api_clients.sh
      - name: Run tests
        run: docker compose run -e CI=1 react npm install-test
