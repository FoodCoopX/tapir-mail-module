name: React tests docker

on: [push]

jobs:
  react-tests-docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: docker compose build
      - name: Bundle
        run: docker compose run web ./bundle.sh
      - name: Run tests
        run: docker compose run -w /app/tapir_mail_ui/ -e CI=1 web npm run test
