[tool.poetry]
name = "tapir-mail"
version = "0.1.0"
description = ""
authors = ["Théophile Madet <theo.madet@posteo.net>", "Michael Kleimann <dev@mkleimann.com>"]
readme = "README.md"
packages = [{include = "tapir_mail"}]
include = ["tapir_mail/__ui__/**/*", "tapir_mail/__static__/**/*", "tapir_mail/scripts/*"]

[tool.poetry.dependencies]
python = "^3.11"
django = "^3.2.22"
django-environ = "^0.10.0"
django-cors-headers = "^4.3.0"
django-drf-filepond = "^0.5.0"
djangorestframework = "^3.14.0"
drf-spectacular = "^0.26.4"
nanoid = "^2.0.0"
django-mjml = "^1.1"
celery = "^5.3.4"
redis = "^5.0.1"
django-redis = "^5.4.0"
django-filter = "^23.3"
beautifulsoup4 = "^4.12.2"

[tool.poetry.group.dev.dependencies]
black = "^23.10.1"
pre-commit = "^3.5.0"
pytest-django = "^4.5.2"
factory-boy = "^3.3.0"
django-extensions = "^3.2.3"
flower = "^2.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tapir_mail_server.settings"
python_files = "tests.py test_*.py"
filterwarnings = [
    "ignore:::.*django.*", #ignore warnings coming from the django lib
    "ignore::django.utils.deprecation.RemovedInDjango40Warning" #ignore django deprecation warnings
]
