[tool.poetry]
name = "tapir-mail"
version = "0.1.0"
description = ""
authors = ["Théophile Madet <theo.madet@posteo.net>", "Michael Kleimann <dev@mkleimann.com>"]
readme = "README.md"
packages = [{ include = "tapir_mail" }]
include = [
    { path = "tapir_mail/__ui__/*", format = ["sdist", "wheel"] },
    { path = "tapir_mail/__static__/*", format = ["sdist", "wheel"] },
    { path = "tapir_mail/__static__/**/*", format = ["sdist", "wheel"] },
]


[tool.poetry.dependencies]
python = "^3.14"
django = "^6.0.7"
django-environ = "^0.14.0"
django-cors-headers = "^4.9.0"
django-drf-filepond = "^0.5.2"
djangorestframework = "^3.17.1"
drf-spectacular = "^0.30.0"
nanoid = "^2.0.0"
celery = "^5.5.0"
redis = "^8.1.0"
django-redis = "^7.0.0"
django-filter = "^26.1"
flufl-bounce = "^4.0"
lxml = "^6.1.1"
beautifulsoup4 = "^4.15.0"
whitenoise = "^6.12.0"
psycopg2-binary = "^2.9.11"
django-bootstrap5 = "^26.2"

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
pre-commit = "^4.6.1"
pytest-django = "^4.12.0"
factory-boy = "^3.3.3"
django-extensions = "^4.1"
flower = "^2.0.1"
icecream = "^2.1.4"
django-upgrade = "^1.31.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tapir_mail_server.settings"
python_files = "tests.py test_*.py"
filterwarnings = [
    "ignore:::.*django.*", #ignore warnings coming from the django lib
]
