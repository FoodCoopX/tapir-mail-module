[tool.poetry]
name = "tapir-mail"
version = "0.1.0"
description = ""
authors = ["Théophile Madet <theo.madet@posteo.net>", "Michael Kleimann <dev@mkleimann.com>"]
readme = "README.md"
packages = [{include = "tapir_mail"}]
include = [
    {path = "tapir_mail/__ui__/*", format = ["sdist", "wheel"]},
    {path = "tapir_mail/__static__/*", format = ["sdist", "wheel"]},
    {path = "tapir_mail/__static__/**/*", format = ["sdist", "wheel"]},
]


[tool.poetry.dependencies]
python = "^3.14"
django = "^6.0.1"
django-environ = "^0.12.0"
django-cors-headers = "^4.7.0"
django-drf-filepond = "^0.5.2"
djangorestframework = "^3.16.0"
drf-spectacular = "^0.29.0"
nanoid = "^2.0.0"
celery = "^5.5.0"
redis = "^5.2.1"
django-redis = "^5.4.0"
django-filter = "^25.1"
flufl-bounce = "^4.0"
lxml = "^5.3.2"
beautifulsoup4 = "^4.13.3"
whitenoise = "^6.11.0"
django-upgrade = "^1.29.1"
psycopg2-binary = "^2.9.11"
django-bootstrap5 = "^26.1"

[tool.poetry.group.dev.dependencies]
black = "^26.1.0"
pre-commit = "^4.2.0"
pytest-django = "^4.11.1"
factory-boy = "^3.3.3"
django-extensions = "^3.2.3"
flower = "^2.0.1"
icecream = "^2.1.4"
django-upgrade = "^1.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tapir_mail_server.settings"
python_files = "tests.py test_*.py"
filterwarnings = [
    "ignore:::.*django.*", #ignore warnings coming from the django lib
]
